<!DOCTYPE html>
<html>
<head>
  <title>YAYYYYYYY!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1a0000);
      position: relative;
      overflow-x: hidden;
      color: white;
    }

    /* Polaroids */
    .bg-polaroid {
      position: absolute;
      width: 18vw;          
      height: 24vw;
      max-width: 220px;     
      max-height: 280px;
      background-size: cover;
      background-position: center;
      border: 6px solid white;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      opacity: 0.25;
      filter: blur(2px);
      z-index: 0;
    }

    /* Tablet adjustments for polaroids */
    @media (min-width: 768px) and (max-width: 1024px) {
      .bg-polaroid {
        width: 14vw;
        height: 19vw;
        max-width: 200px;
        max-height: 260px;
        opacity: 0.2;
        filter: blur(1.5px);
      }
    }

    /* Content card */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      padding: 50px 30px;
      max-width: 650px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Tablet adjustments for content card */
    @media (min-width: 768px) and (max-width: 1024px) {
      .content {
        width: 80%;
        max-width: 600px;
        padding: 40px 25px;
      }
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
    }

    /* Tablet heading adjustment */
    @media (min-width: 768px) and (max-width: 1024px) {
      h1 {
        font-size: clamp(2rem, 4vw, 2.5rem);
      }
    }

    p {
      font-size: 1.2rem;
      margin: 5px 0;
    }

    /* Tablet paragraph adjustment */
    @media (min-width: 768px) and (max-width: 1024px) {
      p {
        font-size: 1.1rem;
      }
    }

    #count {
      font-weight: bold;
      color: #ffdd00;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .bg-polaroid {
        display: none; 
      }
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
      .content {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>


<div class="bg-polaroid" style="top: 3%; left: 6%; transform: rotate(-6deg); background-image: url('../images/css1.jpeg');"></div>

<div class="bg-polaroid" style="top: 45%; left: 70%; transform: rotate(-2deg); background-image: url('../images/css9.png');"></div>
<div class="bg-polaroid" style="top: 60%; left: 25%; transform: rotate(4deg); background-image: url('../images/css10.png');"></div>
<div class="bg-polaroid" style="top: 70%; left: 58%; transform: rotate(-6deg); background-image: url('../images/css11.png');"></div>
<div class="bg-polaroid" style="top: 70%; left: 80%; transform: rotate(5deg); background-image: url('../images/css12.png');"></div>

<!-- Content card -->

  <h1>YAYYY ❤️</h1>

</body>
</html>
