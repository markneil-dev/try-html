<!DOCTYPE html>
<html>
<head>
  <title>YAYYYYYYY!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1a0000);
      position: relative;
      overflow: hidden;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ================= POLAROIDS ================= */
    .bg-polaroid {
      position: absolute;
      width: 190px;              /* fixed base for stability */
      aspect-ratio: 3/4;
      background-size: cover;
      background-position: center;
      border: 6px solid white;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      opacity: 0.25;
      filter: blur(2px);
      z-index: 0;
    }

    /* Galaxy Tab S9 FE (approx 1440px–2400px width landscape) */
    @media (min-width: 1300px) and (max-width: 2400px) {
      .bg-polaroid {
        width: 170px;  /* slightly smaller to prevent collision */
      }
    }

    /* ================= CONTENT CARD ================= */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      width: min(90%, 650px);
      padding: 45px 30px;
      background: rgba(225, 9, 9, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(225, 9, 9, 0.15);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.15rem;
      margin: 5px 0;
    }

    #count {
      font-weight: bold;
      color: #ffdd00;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .bg-polaroid {
        display: none;
      }

      .content {
        width: 92%;
        padding: 30px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

<!-- Polaroids -->
<div class="bg-polaroid" style="top: 3%; left: 6%; transform: rotate(-6deg); background-image: url('../images/css1.jpeg');"></div>
<div class="bg-polaroid" style="top: 8%; left: 38%; transform: rotate(4deg); background-image: url('../images/css2.jpeg');"></div>
<div class="bg-polaroid" style="top: 6%; left: 72%; transform: rotate(-3deg); background-image: url('../images/css3.jpeg');"></div>
<div class="bg-polaroid" style="top: 22%; left: 20%; transform: rotate(5deg); background-image: url('../images/css4.jpeg');"></div>
<div class="bg-polaroid" style="top: 28%; left: 55%; transform: rotate(-4deg); background-image: url('../images/css5.jpeg');"></div>
<div class="bg-polaroid" style="top: 40%; left: 83%; transform: rotate(6deg); background-image: url('../images/css6.jpeg');"></div>
<div class="bg-polaroid" style="top: 40%; left: 8%; transform: rotate(-5deg); background-image: url('../images/css7.jpeg');"></div>
<div class="bg-polaroid" style="top: 55%; left: 42%; transform: rotate(3deg); background-image: url('../images/css8.png');"></div>
<div class="bg-polaroid" style="top: 45%; left: 70%; transform: rotate(-2deg); background-image: url('../images/css9.png');"></div>
<div class="bg-polaroid" style="top: 60%; left: 25%; transform: rotate(4deg); background-image: url('../images/css10.png');"></div>
<div class="bg-polaroid" style="top: 70%; left: 58%; transform: rotate(-6deg); background-image: url('../images/css11.png');"></div>
<div class="bg-polaroid" style="top: 70%; left: 80%; transform: rotate(5deg); background-image: url('../images/css12.png');"></div>
<div class="bg-polaroid" style="top: 70%; left: 5%; transform: rotate(-4deg); background-image: url('../images/css13.png');"></div>

<!-- Content card -->
<div class="content">
  <h1>You said Yes!</h1>
  <p>See you on February 14 at 7:00pm</p>
  <p>We will be having dinner at Samgyupsal, so please dress accordingly.</p>
  <p>I miss you very much, my love, and I can’t wait to see you.</p>
  <p>Happy Valentine’s Day.</p>
  <p>I love you, my Kristine ❤️</p>
  <p>But why did you say "No" <span id="count"></span> times? 😒</p>
</div>

<script>
  const count = localStorage.getItem("noCount") || 0;
  document.getElementById("count").textContent = count;
  localStorage.setItem("noCount", 0);
</script>

</body>
</html>
